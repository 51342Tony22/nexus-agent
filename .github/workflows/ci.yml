name: harness-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-quality-gate:
    name: deterministic-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests may construct an LLM client, but the default suite must never make
      # a paid call. A loopback refusal makes accidental calls fail locally.
      SILICONFLOW_API_KEY: ci-placeholder-not-a-secret
      SILICONFLOW_BASE_URL: http://127.0.0.1:9/v1
      LLM_TIMEOUT_SECONDS: "0.2"
      LLM_MAX_RETRIES: "0"
      EMBEDDING_LOCAL_FILES_ONLY: "true"
      RUFF_CACHE_DIR: /tmp/fyp-mini-agent-ruff-cache
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev-lock.txt

      - name: Run deterministic Harness gate
        run: make check PYTHON=python
